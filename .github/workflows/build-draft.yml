# Used when a draft is pushed to GitHub
# This does not make use of any caching as to ensure a clean build

name: Build - Draft
on:
  release:
    types: [ released ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17 ]

    steps:
      - name: Extract current branch name
        shell: bash
        # bash pattern expansion to grab branch name without slashes
        run: ref="${GITHUB_REF#refs/heads/}" && echo "branch=${ref////-}" >> $GITHUB_OUTPUT
        id: ref

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build Standard Variant
        run: ./gradlew clean build -PbuildVariant=standard

      - name: Rename Standard Build
        run: |
          mkdir -p release-artifacts
          cp build/libs/*.jar release-artifacts/
          
      - name: Build Amecs Variant
        run: ./gradlew amecsJar -PbuildVariant=amecs

      - name: Prepare Release Artifacts
        run: |
          cp build/libs/*.jar release-artifacts/
          cp LICENSE release-artifacts/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'release-artifacts/*'
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          append_body: true
          body: |
            ## Build Variants
            
            This draft release includes two variants:
            - **Standard**: Includes bundled Modern KeyBinding and Controlling mods
            - **Amecs**: Compatible with external Amecs mod (excludes bundled keybinding mods)
            
            Choose the variant that matches your setup!